apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-deployment
  labels:
    app: fastapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
      - name: fastapi-container
        #image: your-registry-username/image:tag
        image: imrankhanin3/fastapi_demo:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 80  #The port your FastAPI app runs on inside the container
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-loadbalancer-service
spec:
  type: LoadBalancer
  selector:
    app: fastapi
  ports:
  - protocol: TCP
    port: 80          # The port exposed to the public internet
    targetPort: 80  # The port your FastAPI app runs on inside the container

